name: NodePulse E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  checks: write

jobs:
  test:
    name: Run Pytest and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      working-directory: ./nodepulse-addon
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Install Playwright Browsers
      working-directory: ./nodepulse-addon
      run: playwright install chromium --with-deps

    - name: Run E2E tests
      working-directory: ./nodepulse-addon
      run: python3 -m pytest tests/e2e/ -v --junitxml=test-results.xml

    - name: Run unit tests with coverage
      working-directory: ./nodepulse-addon
      run: python3 -m pytest tests/unit/ --cov=app --cov-report=xml --cov-report=term-missing -v

    - name: Upload test results artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: nodepulse-addon/test-results.xml
        retention-days: 30

    - name: Upload coverage report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: nodepulse-addon/htmlcov/
        retention-days: 30

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: nodepulse-addon/test-results.xml
        check_name: E2E Test Results

    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request'
      uses: codecov/codecov-action@v4
      with:
        files: nodepulse-addon/coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Publish test summary
      if: always()
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        
        E2E_PASS=$(python3 -c "
import xml.etree.ElementTree as ET
tree = ET.parse('nodepulse-addon/test-results.xml')
root = tree.getroot()
e2e = root.find('.//testsuite[@name='E2E Tests']')
if e2e is not None:
    print(e2e.get('tests', '0'))
    print(e2e.get('errors', '0'))
    print(e2e.get('failures', '0'))
    print(e2e.get('tests', '0') - e2e.get('errors', '0') - e2e.get('failures', '0'))
else:
    print('0')
    print('0')
    print('0')
    print('0')
" 2>/dev/null || echo "0\n0\n0\n0")
        UUT_PASS=$(python3 -c "
import xml.etree.ElementTree as ET
tree = ET.parse('nodepulse-addon/test-results.xml')
root = tree.getroot()
uut = root.find('.//testsuite[@name='Unit Tests']')
if uut is not None:
    print(uut.get('tests', '0'))
    print(uut.get('errors', '0'))
    print(uut.get('failures', '0'))
    print(uut.get('tests', '0') - uut.get('errors', '0') - uut.get('failures', '0'))
else:
    print('0')
    print('0')
    print('0')
    print('0')
" 2>/dev/null || echo "0\n0\n0\n0")
        IFS=' ' read -r E2E_TOTAL E2E_ERRORS E2E_FAILS E2E_PASSED <<< "$E2E_PASS"
        IFS=' ' read -r UUT_TOTAL UUT_ERRORS UUT_FAILS UUT_PASSED <<< "$UUT_PASS"
        
        echo "- **E2E Tests**: $E2E_PASSED passed / $E2E_TOTAL total" >> $GITHUB_STEP_SUMMARY
        echo "- **Unit Tests**: $UUT_PASSED passed / $UUT_TOTAL total" >> $GITHUB_STEP_SUMMARY
        echo "- **Errors**: $((E2E_ERRORS + UUT_ERRORS))" >> $GITHUB_STEP_SUMMARY
        echo "- **Failures**: $((E2E_FAILS + UUT_FAILS))" >> $GITHUB_STEP_SUMMARY
        echo "- **Coverage**: Uploaded to Codecov (if push to main)" >> $GITHUB_STEP_SUMMARY
