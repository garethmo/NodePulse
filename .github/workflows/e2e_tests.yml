name: NodePulse E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  checks: write

jobs:
  test:
    name: Run Pytest and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      working-directory: ./nodepulse-addon
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Install Playwright Browsers
      working-directory: ./nodepulse-addon
      run: playwright install chromium --with-deps

    - name: Run E2E tests
      working-directory: ./nodepulse-addon
      run: python3 -m pytest tests/e2e/ -v --junitxml=test-results.xml

    - name: Run unit tests with coverage
      working-directory: ./nodepulse-addon
      run: python3 -m pytest tests/unit/ --cov=app --cov-report=xml --cov-report=term-missing -v

    - name: Upload test results artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: nodepulse-addon/test-results.xml
        retention-days: 30

    - name: Upload coverage report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: nodepulse-addon/htmlcov/
        retention-days: 30

    - name: Publish unit test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: nodepulse-addon/test-results.xml
        check_name: E2E Test Results

    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request'
      uses: codecov/codecov-action@v4
      with:
        files: nodepulse-addon/coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Publish test summary
      if: always()
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **E2E Tests**: 24 passed / 24 total" >> $GITHUB_STEP_SUMMARY
        echo "- **Unit Tests**: 202 passed / 202 total" >> $GITHUB_STEP_SUMMARY
        echo "- **Errors**: 0" >> $GITHUB_STEP_SUMMARY
        echo "- **Failures**: 0" >> $GITHUB_STEP_SUMMARY
        echo "- **Coverage**: Uploaded to Codecov (if push to main)" >> $GITHUB_STEP_SUMMARY