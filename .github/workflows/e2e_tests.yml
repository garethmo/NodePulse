name: NodePulse E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest and Playwright
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      working-directory: ./nodepulse-addon
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Install Playwright Browsers
      working-directory: ./nodepulse-addon
      run: playwright install chromium --with-deps

    - name: Run E2E tests
      working-directory: ./nodepulse-addon
      run: python3 -m pytest tests/e2e/ -v --junitxml=test-results.xml

    - name: Run unit tests with coverage
      working-directory: ./nodepulse-addon
      run: python3 -m pytest tests/unit/ --cov=app --cov-report=xml --cov-report=term-missing -v

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: nodepulse-addon/test-results.xml

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: nodepulse-addon/htmlcov/

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: nodepulse-addon/test-results.xml
        check_name: E2E Test Results
